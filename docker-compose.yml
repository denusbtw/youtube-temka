x-worker-environment: &worker-environment
  FACTORY_DATA: /data
  FACTORY_SCRATCH: /scratch
  FACTORY_AUTOMATIC_PUBLISHING: "0"
  FACTORY_TOKEN: ${FACTORY_TOKEN:-}
  SCRATCH_GB: ${SCRATCH_GB:-8}
  FREE_RESERVE_GB: ${FREE_RESERVE_GB:-4}
  ASSET_CACHE_BYTES: ${ASSET_CACHE_BYTES:-2147483648}
  WHISPER_MODEL: ${WHISPER_MODEL:-small}
  WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
  WHISPER_COMPUTE: ${WHISPER_COMPUTE:-int8}
  ASR_CHUNK_SECONDS: ${ASR_CHUNK_SECONDS:-300}
  FACTORY_SHORTS_MAX_SECONDS: ${FACTORY_SHORTS_MAX_SECONDS:-180}
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  MALLOC_ARENA_MAX: '2'
  FACTORY_HOST_LOCK_DIR: /host-locks
  ASR_HOST_SLOTS: '1'
  OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
  OLLAMA_GPU_LAYERS: ${OLLAMA_GPU_LAYERS:-0}
  DRIVE_TOKEN_FILE: ${DRIVE_TOKEN_FILE:-/run/secrets/drive-token.json}
  DRIVE_OAUTH_CLIENT_FILE: ${DRIVE_OAUTH_CLIENT_FILE:-}
  DRIVE_OAUTH_TOKEN_FILE: ${DRIVE_OAUTH_TOKEN_FILE:-}
  DRIVE_PARENT_ID: ${DRIVE_PARENT_ID:-}
  YOUTUBE_TOKEN_DIR: /run/secrets/youtube
  YOUTUBE_ANALYTICS_TOKEN_DIR: /run/secrets/analytics
  FFMPEG_ENCODER: ${FFMPEG_ENCODER:-x264}
services:
  ollama:
    profiles: [controller, worker]
    image: ollama/ollama@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    environment:
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_KEEP_ALIVE: '0'
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    mem_limit: 4g
    memswap_limit: 4g
    cpus: 4
    healthcheck:
      test: [CMD, ollama, list]
      interval: 15s
      timeout: 5s
      retries: 3
  controller:
    profiles: [controller]
    build:
      context: .
      dockerfile: deploy/factory.Dockerfile
      args:
        WITH_TTS: ${WITH_TTS:-0}
    environment:
      <<: *worker-environment
      WORKER_ID: ${CONTROLLER_WORKER_ID:-worker-a}
      FACTORY_MANAGED_YOUTUBE_DIR: /run/secrets/youtube-managed/upload
      FACTORY_MANAGED_ANALYTICS_DIR: /run/secrets/youtube-managed/analytics
    ports: ['${API_BIND:-127.0.0.1}:8000:8000']
    volumes:
      - controller_data:/data
      - ${CONTROLLER_SCRATCH_DIR:-./scratch/controller}:/scratch
      - ${SECRETS_DIR:-./secrets}:/run/secrets:ro
      - ${LEGACY_DRIVE_SECRETS_DIR:-./secrets/legacy-drive}:/run/legacy-drive:ro
      - controller_models:/home/factory/.cache
      - host_locks:/host-locks
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: ${FACTORY_MEMORY_LIMIT:-4g}
    memswap_limit: ${FACTORY_MEMORY_LIMIT:-4g}
    cpus: 4
  web:
    profiles: [controller]
    build:
      context: .
      dockerfile: deploy/factory-web.Dockerfile
    ports: ['${WEB_BIND:-127.0.0.1}:5175:80']
    depends_on:
      controller:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/factory.html]
      interval: 15s
      timeout: 3s
      retries: 3
  worker:
    profiles: [worker]
    build:
      context: .
      dockerfile: deploy/factory.Dockerfile
      args:
        WITH_TTS: ${WITH_TTS:-0}
    environment:
      <<: *worker-environment
      CONTROLLER_URL: ${CONTROLLER_URL:-}
      WORKER_ID: ${WORKER_ID:-worker-b}
    command: [python, -m, factory.worker]
    volumes:
      - worker_data:/data
      - ${WORKER_SCRATCH_DIR:-./scratch/worker}:/scratch
      - worker_models:/home/factory/.cache
      - host_locks:/host-locks
      - ${SECRETS_DIR:-./secrets}:/run/secrets:ro
      - ${LEGACY_DRIVE_SECRETS_DIR:-./secrets/legacy-drive}:/run/legacy-drive:ro
    restart: unless-stopped
    mem_limit: ${FACTORY_MEMORY_LIMIT:-4g}
    memswap_limit: ${FACTORY_MEMORY_LIMIT:-4g}
    cpus: 4
    healthcheck:
      disable: true
volumes:
  controller_data:
  controller_models:
  worker_data:
  worker_models:
  ollama_models:
  host_locks:
    name: ai-content-factory-host-locks
